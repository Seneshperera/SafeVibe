version: weights_v1
# Relative weights per signal family. Renormalised over the families actually evaluated.
weights:
  content: 0.30
  url: 0.30
  sender: 0.15
  domain: 0.10
  conversation: 0.10
  image: 0.05

# If an external threat-intel service flags the URL as malicious, the final score is raised
# to at least this value (a confirmed external hit is stronger than any heuristic mix).
external_malicious_floor: 75
